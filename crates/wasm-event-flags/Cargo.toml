[package]
name = "wasm-event-flags"
version = "0.1.0"
edition = "2021"
description = "WebAssembly module for Elden Ring event flags detection - shared between ER-save-Editor and elden-map"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
