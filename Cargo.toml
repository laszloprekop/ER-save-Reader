[workspace]
members = [".", "crates/wasm-event-flags"]

[package]
name = "er-save-editor"
version = "0.7.1"
edition = "2021"

[dependencies]
wasm-event-flags = { path = "crates/wasm-event-flags" }
aes = "0.8.4"
binary-reader = "0.4.5"
bitflags = "2.4.2"
cbc = "0.1.2"
eframe = "0.29"
egui-phosphor = { version = "0.7", features = ["regular", "fill"] }
egui_extras = "0.29"
encoding_rs = "0.8.33"
env_logger = "0.11.2"
image = "0.25.0"
md5 = "0.7.0"
once_cell = "1.19.0"
regex = "1.10.4"
reqwest = { version = "0.13", features = ["json", "blocking"] }
rfd = "0.13.0"
rust-embed = "8.3.0"
serde = { version = "1.0.198", features = ["derive"] }
serde_json = "1.0.116"
chrono = { version = "0.4", features = ["serde"] }
strsim = "0.11.0"
zstd = "0.13.1"
flate2 = "1.0.34"
zune-inflate = "0.2.54"
roxmltree = "0.20"

[build-dependencies]
winres = "0.1.12"
serde_json = "1.0.116"
