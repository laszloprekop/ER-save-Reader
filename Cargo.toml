[workspace]
members = [".", "crates/wasm-event-flags"]

# `er-reconstruct` (git dep) declares wasm-event-flags from ER-save-Reader.git.
# Redirect that to this repo's own copy so the graph holds a single
# wasm-event-flags — the git-fetched core and this reader share one instance,
# not two that fail to unify at the type level (ADR-0010).
[patch."https://github.com/laszloprekop/ER-save-Reader.git"]
wasm-event-flags = { path = "crates/wasm-event-flags" }

[package]
name = "er-save-reader"
version = "0.39.8"
edition = "2021"

[lib]
name = "er_save_reader"
path = "src/lib.rs"

[[bin]]
name = "er-save-reader"
path = "src/main.rs"

[features]
default = []
# Dormant save write-back path (ADR-0009). The app is a reader: it reconstructs
# character state from a save the way the game loads it, and never writes back.
# Everything that serialises state to bytes — the `Write` trait and its impls,
# `ViewModel::update_save`, the `SaveType` mutators, the character importer —
# lives behind this flag so it stays in the tree, resurrectable, but out of the
# default build. Keep it compiling: `cargo check --features save-writeback`.
# The reconstruction core now owns the extracted `save/` code, including its
# dormant mutators and `impl Write` blocks, so the reader's write-back build must
# turn the feature on there too.
save-writeback = ["er-reconstruct/save-writeback"]

[lints.clippy]
# `foo.rs` containing `pub mod foo { … }` is the layout used throughout this
# crate. Unwinding it would touch every `use` path for no behavioural gain.
module_inception = "allow"

[dependencies]
wasm-event-flags = { path = "crates/wasm-event-flags" }
# The shared reconstruction core (ADR-0010). Owns the extracted `save/` parsing
# and the `reconstruct(bytes, slot) -> ReconstructedCharacter` entry point; the
# reader links it natively and re-exports its `save`/`write` modules as a facade
# during the transition. Pinned to a rev (drift-proof): adopting a core fix is a
# deliberate rev bump, never silent. The `[patch]` below unifies wasm-event-flags
# so the git-fetched core and this reader share one copy.
er-reconstruct = { git = "https://github.com/laszloprekop/er-reconstruct.git", rev = "9e800f1c04a35e999bf8d1d4a3e33b342af1e03c" }
aes = "0.8.4"
binary-reader = "0.4.5"
bitflags = "2.4.2"
cbc = "0.1.2"
eframe = "0.29"
egui-phosphor = { version = "0.7", features = ["regular"] }
egui_extras = "0.29"
encoding_rs = "0.8.33"
env_logger = "0.11.2"
# PNG only. The two call sites are an embedded `icon.png` and
# `MENU_ItemIcon_{:05}.png` — no other format is ever decoded, and nothing is
# ever encoded. `default-formats` pulls in the AVIF *encoder* (ravif → rav1e →
# rand), which is unreachable code carrying advisories.
image = { version = "0.25.0", default-features = false, features = ["png"] }
md5 = "0.7.0"
sha2 = "0.10"
once_cell = "1.19.0"
regex = "1.10.4"
rfd = "0.13.0"
rust-embed = "8.3.0"
serde = { version = "1.0.198", features = ["derive"] }
serde_json = "1.0.116"
chrono = { version = "0.4", features = ["serde"] }
strsim = "0.11.0"
zstd = "0.13.1"
flate2 = "1.0.34"
zune-inflate = "0.2.54"
roxmltree = "0.20"
open = "5"

[build-dependencies]
winres = "0.1.12"
serde_json = "1.0.116"

# Release profile optimizations (applies to all workspace members)
[profile.release]
opt-level = "s"
lto = true
